entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /certs
    watch: true

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/nexus.example.com.crt
        keyFile: /certs/nexus.example.com.key
